name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "--- installed platforms ---"
          ls "$SDK/platforms" || true
          echo "--- installed build-tools ---"
          ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Inject java_init.list at APK root and re-sign
        run: |
          APKS=$(find app/build/outputs/apk/release -name "*.apk")
          echo "APKs: $APKS"
          for APK in $APKS; do
            echo "=== $APK ==="
            python3 ci/inject_java_init_list.py "$APK" "com.qingmanlsland.adpatch.AdFreeModule"
            # re-sign with debug keystore (v1+v2), preserve alignment
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
            ZALIGN=$(find "$SDK/build-tools" -name zipalign | sort | tail -1)
            echo "apksigner=$APKSIGNER zipalign=$ZALIGN"
            "$ZALIGN" -f 4 "$APK" "$APK.aligned"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$APK" "$APK.aligned"
            "$APKSIGNER" verify --verbose "$APK" | head -8
            rm -f "$APK.aligned"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QmlAdFree-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error